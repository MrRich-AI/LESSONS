<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGCSE ESL Lessons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px;position:relative;z-index:1}
  main.wrap{padding-top:32px;padding-bottom:40px}
  .units{display:grid;grid-template-columns:1fr;gap:12px}
  @media (min-width:560px){.units{grid-template-columns:repeat(2,1fr)}}
  @media (min-width:900px){.units{grid-template-columns:repeat(3,1fr)}}
  .unit-btn{appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%;display:flex;align-items:center;gap:16px}
  .unit-btn small,.unit-btn strong,.unit-btn .count{display:block}
  .panel[hidden]{display:none}
  .lessons{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .lessons a{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit}
  .tag{flex:0 0 auto;white-space:nowrap}
  .arrow{margin-left:auto;flex:0 0 auto}
  footer{text-align:center}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  :root{--navy:#10243e;--navy-2:#1b3658;--gold:#c9a24a;--gold-soft:#f5ecd7;--bg:#f4f5f7;--card:#fff;--ink:#16202e;--muted:#5d6878;--line:#dfe3e9}
  body{background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif}
  .hero{background:var(--navy);color:#fff;padding:40px 0 38px;border-bottom:4px solid var(--gold);
    background-image:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%)}
  .hero .wrap{display:flex;align-items:center;gap:22px}
  .crest{flex:0 0 68px;height:68px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;color:var(--gold);background:rgba(255,255,255,.04)}
  .crest svg{width:34px;height:34px}
  .kicker{font-size:.76rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  .hero h1{font-family:"Source Serif 4",Georgia,serif;font-weight:700;font-size:clamp(2rem,5.5vw,3rem);margin:6px 0 6px;letter-spacing:-.01em}
  .hero p{margin:0;opacity:.85;font-size:1.02rem}
  @media (max-width:480px){.crest{display:none}}
  .grade{margin-bottom:36px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;box-shadow:0 1px 2px rgba(16,36,62,.06)}
  .grade h2{font-family:"Source Serif 4",Georgia,serif;font-weight:700;font-size:1.4rem;color:var(--navy);margin:0 0 16px;display:flex;align-items:center;gap:12px}
  .pill{font-family:"Source Sans 3",sans-serif;font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6b5320;background:var(--gold-soft);padding:4px 10px;border-radius:4px}
  .unit-btn{background:#fafbfc;border:1px solid var(--line);border-radius:8px;padding:14px 16px;transition:border-color .15s,background .15s,box-shadow .15s}
  .unit-btn:hover{border-color:var(--navy-2);background:#fff;box-shadow:0 6px 16px -10px rgba(16,36,62,.5)}
  .unit-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .unit-btn[aria-expanded="true"]{border-color:var(--navy);background:#fff;box-shadow:inset 0 -3px 0 var(--gold)}
  .num{flex:0 0 46px;height:46px;border-radius:6px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-family:"Source Serif 4",Georgia,serif;font-weight:700;font-size:1.3rem}
  .unit-btn small{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .unit-btn strong{font-size:1.08rem;font-weight:700;color:var(--navy);margin-top:2px}
  .unit-btn .count{font-size:.85rem;color:var(--muted);margin-top:2px}
  .panel{margin-top:16px;border-top:1px solid var(--line);padding-top:18px}
  .panel h3{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:1.15rem;color:var(--navy);margin:0 0 12px}
  .lessons a{padding:14px 16px;border-radius:8px;border:1px solid var(--line);border-left:4px solid var(--gold);background:#fff;transition:background .15s,border-color .15s}
  .lessons a:hover{background:#f8f9fb;border-color:var(--navy-2);border-left-color:var(--gold)}
  .lessons a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .tag{font-size:.74rem;font-weight:700;color:#fff;background:var(--navy);padding:4px 10px;border-radius:4px}
  .lessons .t{font-weight:600;line-height:1.4}
  .arrow{color:var(--gold);font-size:1.4rem}
  footer{color:var(--muted);font-size:.85rem;padding:0 16px 32px}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
    <div class="crest" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8l10-5 10 5-10 5-10-5z"/><path d="M6 10v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/><path d="M22 8v6"/></svg></div>
    <div>
      <div class="kicker">Cambridge IGCSE · English as a Second Language</div>
      <h1>ESL Lessons</h1>
      <p>Choose your unit to see its lessons.</p>
    </div>
  </div></header>

<main class="wrap" id="app"></main>
<footer>Pick a unit, then a lesson.</footer>

<script>
/* To add a lesson: add it to the matching unit's "lessons" list (or add a new unit). */
var CATALOG = [
  { grade: "Grade 9", id: "g9", units: [
    { num: 3, title: "Food", lessons: [
      { tag: "A & B", title: "Food — Sections A & B1–5", href: "G9/unit-03-food/" },
      { tag: "Writing", title: "Writing & Linking devices", href: "G9/unit-03-food-writing/" }
    ]}
  ]},
  { grade: "Grade 10", id: "g10", units: [
    { num: 13, title: "Success and fame", lessons: [
      { tag: "A–C", title: "Watch and talk · Speaking and vocabulary · Reading: Note-taking", href: "G10/unit-13-success-and-fame/" },
      { tag: "D", title: "Reading and vocabulary (Helen Keller) · Language focus: Discourse markers showing contrast", href: "G10/unit-13-success-and-fame-section-d/" },
      { tag: "E", title: "Listening (Nelson Suresh Kumar: the Himalayan Moto Adventure)", href: "G10/unit-13-success-and-fame-section-e/" }
    ]}
  ]}
];

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

var app = document.getElementById("app");
var html = "";
CATALOG.forEach(function(g){
  var total = g.units.length;
  html += '<section class="grade" aria-labelledby="h-' + g.id + '"><h2 id="h-' + g.id + '">' + esc(g.grade) +
          ' <span class="pill">' + total + (total === 1 ? " unit" : " units") + '</span></h2><div class="units">';
  g.units.forEach(function(u){
    var key = g.id + "-unit-" + u.num;
    html += '<button class="unit-btn" type="button" aria-expanded="false" aria-controls="p-' + key + '" data-key="' + key + '">' +
            '<span class="num">' + u.num + '</span><span><small>Unit ' + u.num + '</small><strong>' + esc(u.title) + '</strong>' +
            '<span class="count">' + u.lessons.length + (u.lessons.length === 1 ? " lesson" : " lessons") + '</span></span></button>';
  });
  html += '</div>';
  g.units.forEach(function(u){
    var key = g.id + "-unit-" + u.num;
    html += '<div class="panel" id="p-' + key + '" hidden><h3>' + esc(g.grade) + ' · Unit ' + u.num + ': ' + esc(u.title) + '</h3><ul class="lessons">';
    u.lessons.forEach(function(l){
      html += '<li><a href="' + esc(l.href) + '"><span class="tag">' + esc(l.tag) + '</span><span><span class="t">' + esc(l.title) + '</span></span><span class="arrow" aria-hidden="true">›</span></a></li>';
    });
    html += '</ul></div>';
  });
  html += '</section>';
});
app.innerHTML = html;

function openUnit(key, updateHash){
  var btns = document.querySelectorAll(".unit-btn");
  for (var i = 0; i < btns.length; i++){
    var b = btns[i], on = b.getAttribute("data-key") === key && b.getAttribute("aria-expanded") !== "true";
    if (b.getAttribute("data-key") === key && !updateHash) on = true;
    b.setAttribute("aria-expanded", on ? "true" : "false");
    document.getElementById("p-" + b.getAttribute("data-key")).hidden = !on;
    if (on && updateHash) history.replaceState(null, "", "#" + key);
    if (!on && b.getAttribute("data-key") === key && updateHash) history.replaceState(null, "", location.pathname + location.search);
  }
}
app.addEventListener("click", function(e){
  var b = e.target.closest(".unit-btn");
  if (b) openUnit(b.getAttribute("data-key"), true);
});
if (location.hash && document.getElementById("p-" + location.hash.slice(1))) openUnit(location.hash.slice(1), false);
</script>
</body>
</html>
